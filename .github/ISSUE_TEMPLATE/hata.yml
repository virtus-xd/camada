name: Bug report / Hata bildirimi
description: Report something that is broken. / Çalışmayan ya da beklenmedik davranan bir şeyi bildirin.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **If the taskbar stays hidden / Görev çubuğu gizli kaldıysa:** run `CamAda.exe --restore-taskbar`, open the "Görev çubuğunu geri getir" shortcut on your desktop, or (Store version) the "Görev çubuğunu geri getir" entry in the Start menu. / `CamAda.exe --restore-taskbar` çalıştırın, masaüstündeki "Görev çubuğunu geri getir" kısayolunu ya da (Store sürümünde) Başlat menüsündeki aynı adlı girişi açın.
  - type: textarea
    id: ne-oldu
    attributes:
      label: What happened? / Ne oldu?
    validations:
      required: true
  - type: textarea
    id: beklenen
    attributes:
      label: What did you expect? / Ne bekliyordunuz?
  - type: textarea
    id: adimlar
    attributes:
      label: Steps to reproduce / Yeniden üretme adımları
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version / Windows sürümü
      description: "winver"
      placeholder: 11 24H2 (26100.xxxx)
    validations:
      required: true
  - type: input
    id: surum
    attributes:
      label: Camada version or commit / Camada sürümü ya da commit
      placeholder: Store 1.0.0 / main @ abc1234
  - type: textarea
    id: crash-log
    attributes:
      label: crash.log
      description: 'Contents of %LOCALAPPDATA%\CamAda\crash.log (Store version: %LOCALAPPDATA%\Packages\VirtusTech.Camada_6ccshz4mw4fd6\LocalCache\Local\CamAda\crash.log) if present. Check it contains no personal data. / Varsa içeriği; kişisel bilgi olmadığını kontrol edin.'
      render: text
