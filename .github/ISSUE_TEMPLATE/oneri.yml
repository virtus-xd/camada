name: Feature request / Öneri
description: Suggest a feature or improvement. / Yeni bir özellik ya da iyileştirme önerin.
labels: [enhancement]
body:
  - type: textarea
    id: ihtiyac
    attributes:
      label: Need or problem / İhtiyaç ya da sorun
      description: What is hard or missing today? / Neyi yapmakta zorlanıyorsunuz, ne eksik?
    validations:
      required: true
  - type: textarea
    id: cozum
    attributes:
      label: Proposed solution / Önerilen çözüm
      description: How would you like it to work? / Nasıl çalışmasını isterdiniz?
  - type: textarea
    id: alternatifler
    attributes:
      label: Alternatives considered / Düşünülen alternatifler
